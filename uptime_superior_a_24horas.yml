---
- name: Desligar workstations com uptime superior a 24 horas
  hosts: todos
  gather_facts: false

  tasks:
    - name: Executar script PowerShell
      ansible.windows.win_powershell:
        script: |
          $DomainName = "inacom.local"
          $MaxUptimeHours = 24
          $ShutdownDelay = 600

          function Exit-Script {
              param([int]$Code,[string]$Message)
              Write-Output $Message
              exit $Code
          }

          $OS = Get-CimInstance Win32_OperatingSystem

          if ($OS.ProductType -ne 1) {
              Exit-Script 0 "Servidor detectado. Ignorado."
          }

          $Computer = Get-CimInstance Win32_ComputerSystem

          if (-not $Computer.PartOfDomain) {
              Exit-Script 0 "Computador fora do domínio."
          }

          if ($Computer.Domain.ToLower() -ne $DomainName.ToLower()) {
              Exit-Script 0 "Domínio diferente."
          }

          $DomainNetwork = Get-NetConnectionProfile |
              Where-Object {$_.NetworkCategory -eq 'DomainAuthenticated'}

          if (-not $DomainNetwork) {
              Exit-Script 0 "Fora da rede corporativa."
          }

          $BootTime = $OS.LastBootUpTime
          $Hours = ((Get-Date)-$BootTime).TotalHours

          if ($Hours -lt $MaxUptimeHours) {
              Exit-Script 0 "Uptime inferior a 24 horas."
          }

          try {
              msg * "Este computador será desligado dentro de 10 minutos."
          } catch {}

          shutdown.exe /s /f /t $ShutdownDelay /c "Desligamento automático"

          Exit-Script 0 "Shutdown agendado."

      register: resultado

    - debug:
        var: resultado.output
