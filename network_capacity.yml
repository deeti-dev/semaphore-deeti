---
# network_capacity.yml
# Diagnóstico de capacidade de rede em hosts Windows
# Disparado via Semaphore, chamado pelo n8n quando a tag "playbook: network_capacity" chega do Zabbix
# (cobre alertas como "Interface X has changed to lower speed than it was before",
# "High bandwidth usage")
#
# Nota: este tipo de alerta costuma vir com severidade "Information" no Zabbix - ou seja,
# não é tipicamente crítico/urgente. O playbook serve mais para dar contexto (a interface
# ainda está em baixa velocidade? é uma questão de sinal/driver? há saturação de banda?)
# do que para acionar remediação imediata.
#
# Em vez de depender de receber o nome exato da interface via tag (frágil, exigiria uma
# segunda extração no Semaphore a partir de um array de tags), este playbook verifica
# TODAS as interfaces físicas do host de uma vez - mais simples e continua a cobrir
# o problema seja qual for a interface (Wi-Fi ou Ethernet).
#
# Uso:
#   ansible-playbook network_capacity.yml -e "target_host=DESKTOP-ERIKSON"
#
# No Semaphore, configurar a Environment variable "target_host" (Variable Group "Webhook Vars")
# para receber o host_name vindo do payload do Zabbix (via n8n).

- name: Diagnóstico de Capacidade de Rede
  hosts: "{{ target_host }}"
  gather_facts: no

  tasks:

    # Passo 0 — Utilizador logado na máquina
    - name: Passo 0 - Utilizador logado
      ansible.windows.win_shell: |
        $cs = Get-CimInstance -ClassName Win32_ComputerSystem
        $logged = $cs.UserName
        $quserOutput = quser 2>$null
 
        if ($logged) {
            [PSCustomObject]@{
                "Utilizador Logado" = $logged
                "Hostname"          = $env:COMPUTERNAME
            } | Format-List | Out-String
        } else {
            "Nenhum utilizador interativo detetado (pode ser sessão de serviço ou máquina sem login)."
        }
 
        Write-Output "`n--- Sessões ativas (quser) ---"
        if ($quserOutput) { $quserOutput } else { "Sem sessões ativas detetadas." }
 
        # Determinar o valor mais fiável para o marcador:
        # 1º sessão de consola (Win32_ComputerSystem.UserName)
        # 2º primeira sessão ativa do quser (cobre RDP)
        # 3º "sem utilizador"
        $marcador = $null
        if ($logged) {
            $marcador = $logged
        } elseif ($quserOutput) {
            $primeiraLinha = $quserOutput | Select-Object -Skip 1 -First 1
            if ($primeiraLinha) {
                $marcador = ($primeiraLinha.Trim() -split '\s{2,}')[0].TrimStart('>')
            }
        }
        if (-not $marcador) { $marcador = "Nenhum utilizador com sessao ativa" }
 
        # Marcador interno para o n8n extrair de forma simples e fiável (removido do
        # relatório final antes de chegar ao Telegram/GLPI)
        "`nLOGGED_USER_MARKER::$marcador"
      register: passo0_utilizador
      failed_when: false

    # Passo 1 — Estado atual de todas as interfaces físicas
    - name: "Passo 1 - Estado das interfaces de rede"
      ansible.windows.win_shell: |
        Get-NetAdapter -Physical |
        Select-Object Name, InterfaceDescription, Status, LinkSpeed, MediaType, MacAddress |
        Format-Table -AutoSize | Out-String -Width 300
      register: passo1_interfaces
      failed_when: false

    - name: Mostrar Passo 1
      ansible.builtin.debug:
        msg: "{{ passo1_interfaces.stdout_lines | default(['Sem dados']) }}"

    # Passo 2 — Utilização de largura de banda em tempo real (2 minutos)
    # % de utilização = (bytes totais/seg * 8) / largura de banda atual * 100
    - name: "Passo 2 - Monitorizar utilização de banda em tempo real (2 minutos)"
      ansible.windows.win_shell: |
        1..8 | ForEach-Object {
            Get-CimInstance Win32_PerfFormattedData_Tcpip_NetworkInterface |
                Where-Object { $_.Name -notmatch 'Loopback|isatap|Teredo' -and $_.CurrentBandwidth -gt 0 } |
                Select-Object @{N="Hora";E={(Get-Date).ToString("HH:mm:ss")}},
                    Name,
                    @{N="Recebido(Kbps)";E={[math]::Round($_.BytesReceivedPersec*8/1KB,1)}},
                    @{N="Enviado(Kbps)";E={[math]::Round($_.BytesSentPersec*8/1KB,1)}},
                    @{N="Uso(%)";E={[math]::Round((($_.BytesTotalPersec*8)/$_.CurrentBandwidth)*100,2)}}
            Start-Sleep -Seconds 15
        } | Format-Table -AutoSize | Out-String -Width 300
      register: passo2_utilizacao
      failed_when: false
      async: 300
      poll: 30

    - name: Mostrar Passo 2
      ansible.builtin.debug:
        msg: "{{ passo2_utilizacao.stdout_lines | default(['(sem output - verificar execução assíncrona)']) }}"

    # Passo 3 — Detalhes Wi-Fi (se o host tiver adaptador sem fios)
    # netsh só devolve dados úteis se houver um adaptador Wi-Fi ligado - falha graciosamente
    # em hosts só com Ethernet.
    - name: "Passo 3 - Detalhes da ligação Wi-Fi (se aplicável)"
      ansible.windows.win_shell: |
        $wifi = netsh wlan show interfaces
        if ($wifi -match "There is no wireless interface") {
            "Este host não tem adaptador Wi-Fi ativo."
        } else {
            $wifi
        }
      register: passo3_wifi
      failed_when: false

    - name: Mostrar Passo 3
      ansible.builtin.debug:
        msg: "{{ passo3_wifi.stdout_lines | default(['Sem dados Wi-Fi']) }}"

    # Passo 4 — Erros de driver de rede no Event Log (últimos 7 dias)
    - name: "Passo 4 - Erros de driver de rede nos últimos 7 dias"
      ansible.windows.win_shell: |
        Get-WinEvent -FilterHashtable @{
            LogName   = 'System'
            Level     = 2
            StartTime = (Get-Date).AddDays(-7)
        } | Where-Object {
            $_.ProviderName -match 'ndis|tcpip|dhcp|e1000|netwtw|rtwlan|nic|wlan'
        } |
        Select-Object TimeCreated, ProviderName, Message |
        Sort-Object TimeCreated -Descending |
        Select-Object -First 20 |
        Format-Table -AutoSize -Wrap | Out-String -Width 300
      register: passo4_erros_driver
      failed_when: false
      # Pode não haver eventos no período - não deve quebrar o playbook

    - name: Mostrar Passo 4
      ansible.builtin.debug:
        msg: "{{ passo4_erros_driver.stdout_lines | default(['Sem erros de driver de rede nos últimos 7 dias']) }}"

    # Consolidar relatório
    - name: Gerar relatório consolidado
      ansible.builtin.set_fact:
        full_report: |
          ================================================================
          DIAGNÓSTICO DE CAPACIDADE DE REDE - {{ inventory_hostname }}
          Data: {{ lookup('pipe', 'date') }}
          ================================================================

          --- UTILIZADOR LOGADO ---
          {{ (passo0_utilizador.stdout | regex_replace('\r?\n?LOGGED_USER_MARKER::.*', '') | trim) if passo0_utilizador.stdout else 'Sem informação' }}

          --- PASSO 1: Estado das interfaces ---
          {{ (passo1_interfaces.stdout | trim) if passo1_interfaces.stdout else 'Sem dados' }}

          --- PASSO 2: Utilização de banda (2 min) ---
          {{ (passo2_utilizacao.stdout | trim) if passo2_utilizacao.stdout else 'Sem dados' }}

          --- PASSO 3: Detalhes Wi-Fi ---
          {{ (passo3_wifi.stdout | trim) if passo3_wifi.stdout else 'Sem dados' }}

          --- PASSO 4: Erros de driver de rede (7 dias) ---
          {{ (passo4_erros_driver.stdout | trim) if passo4_erros_driver.stdout else 'Sem erros' }}

    - name: Mostrar relatório final
      ansible.builtin.debug:
        msg: "{{ full_report }}"

    - name: Retornar relatório para n8n/Semaphore
      ansible.builtin.set_fact:
        diagnostic_report: "{{ full_report }}"
